# Assertion Message Quality Check - Message Templates
# Format: [CODE] Problem. Why: Evidence. Fix: Action. Ref: anchor

assert.message.duplicate=[AMQ01] Duplicate message "{0}". Why: first used at line {1}. Fix: describe the specific invariant at this site. Ref: assertion-messages.adoc#AMQ01

assert.message.redundant.class=[AMQ02] Message "{0}" depends on class name "{1}". Why: {2}. Fix: add 2+ meaningful words that survive without the name. Ref: assertion-messages.adoc#AMQ02

assert.message.redundant.method=[AMQ03] Message "{0}" depends on method name "{1}". Why: {2}. Fix: add 2+ meaningful words that survive without the name. Ref: assertion-messages.adoc#AMQ03

assert.message.redundant.line=[AMQ04] Message "{0}" contains line token "{1}". Why: stack traces show line numbers. Fix: remove and describe the invariant. Ref: assertion-messages.adoc#AMQ04

assert.message.trivial.supplier=[AMQ05] Trivial Supplier "{0}". Why: constant lambda adds overhead with no benefit. Fix: use plain String or include dynamic context. Ref: assertion-messages.adoc#AMQ05

assert.message.generic=[AMQ06] Generic message "{0}". Why: no subject or expected behaviour. Fix: name what is checked and what should hold. Ref: assertion-messages.adoc#AMQ06

assert.message.restates.assertion=[AMQ07] Message "{0}" restates the assertion. Fix: explain expected behaviour, not assertion type. Ref: assertion-messages.adoc#AMQ07

assert.message.index.only=[AMQ08] Index-only message "{0}". Fix: include what the element represents. Ref: assertion-messages.adoc#AMQ08

assert.message.contextless=[AMQ09] Contextless message "{0}". Fix: state what is compared and why it matters. Ref: assertion-messages.adoc#AMQ09

assert.message.too.short=[AMQ10] Message "{0}" too short. Why: words={1} min={2}. Fix: add subject + expected behaviour. Ref: assertion-messages.adoc#AMQ10

assert.message.too.long=[AMQ11] Message "{0}" too long. Why: words={1} max={2}. Fix: keep invariant, move data to expected/actual. Ref: assertion-messages.adoc#AMQ11

assert.message.long.word=[AMQ12] Message "{0}" contains long token "{1}" (>{2} chars). Fix: use short descriptive domain terms. Ref: assertion-messages.adoc#AMQ12
