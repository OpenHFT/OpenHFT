# Meaningful Message Check - Message Templates
# Intent format: concise guidance focused on message intent (suffix .intent).
# Verbose format: [CODE] Problem. Why: Evidence. Fix: Action. Ref: anchor
assert.message.duplicate.intent=[MMDuplicate] Duplicate message "{0}". Use a distinct invariant at this site.
assert.message.duplicate=[MMDuplicate] Duplicate message "{0}". Why: first used at line {1}. Fix: describe the specific invariant at this site. Ref: message-quality-guide.adoc#MMDuplicate
assert.message.redundant.class.intent=[MMRedundantClassName] Message "{0}" leans on class name "{1}". Describe the invariant so it stands alone.
assert.message.redundant.class=[MMRedundantClassName] Message "{0}" depends on class name "{1}". Why: {2}. Fix: add 2+ meaningful words that survive without the name. Ref: message-quality-guide.adoc#MMRedundantClassName
assert.message.redundant.method.intent=[MMRedundantMethodName] Message "{0}" leans on method name "{1}". Describe the invariant so it stands alone.
assert.message.redundant.method=[MMRedundantMethodName] Message "{0}" depends on method name "{1}". Why: {2}. Fix: add 2+ meaningful words that survive without the name. Ref: message-quality-guide.adoc#MMRedundantMethodName
assert.message.redundant.line.intent=[MMRedundantLineNumber] Message "{0}" includes line token "{1}". Remove line numbers and state the invariant.
assert.message.redundant.line=[MMRedundantLineNumber] Message "{0}" contains line token "{1}". Why: stack traces show line numbers. Fix: remove and describe the invariant. Ref: message-quality-guide.adoc#MMRedundantLineNumber
assert.message.trivial.supplier.intent=[MMTrivialSupplier] Trivial Supplier "{0}". Use a direct string or a helper with real work.
assert.message.trivial.supplier=[MMTrivialSupplier] Trivial Supplier "{0}". Why: simple or cheap supplier adds overhead with no benefit. Fix: use plain String or move construction into a helper. Ref: message-quality-guide.adoc#MMTrivialSupplier
assert.message.generic.intent=[MMGenericMessage] Generic message "{0}". Name what is checked and expected.
assert.message.generic=[MMGenericMessage] Generic message "{0}". Why: no subject or expected behaviour. Fix: name what is checked and what should hold. Ref: message-quality-guide.adoc#MMGenericMessage
assert.message.restates.assertion.intent=[MMRestatesAssertion] Message "{0}" restates the assertion. Describe expected behaviour, not the assertion type.
assert.message.restates.assertion=[MMRestatesAssertion] Message "{0}" restates the assertion. Fix: explain expected behaviour, not assertion type. Ref: message-quality-guide.adoc#MMRestatesAssertion
assert.message.index.only.intent=[MMIndexOnly] Index-only message "{0}". Include what the index represents.
assert.message.index.only=[MMIndexOnly] Index-only message "{0}". Fix: include what the element represents. Ref: message-quality-guide.adoc#MMIndexOnly
assert.message.contextless.intent=[MMContextless] Contextless message "{0}". State what is compared and why it matters.
assert.message.contextless=[MMContextless] Contextless message "{0}". Fix: state what is compared and why it matters. Ref: message-quality-guide.adoc#MMContextless
assert.message.too.short.intent=[MMTooShort] Message "{0}" is too short. {4}.
assert.message.too.short=[MMTooShort] Message "{0}" too short. Why: words/placeholders={1} min={2}. Needs {2}+ words; target {2}-{3} words. Fix: {4}. Ref: message-quality-guide.adoc#MMTooShort
assert.message.overused.word.intent=[MMOverusedWord] Overused words in file: {0}. Vary phrasing and add specific context.
assert.message.overused.word=[MMOverusedWord] Overused words in file: {0}. Why: each appears in >50% of {1} messages. Fix: rephrase to reduce repetition below half. Ref: message-quality-guide.adoc#MMOverusedWord
assert.message.lacks.purpose.intent=[MMLacksPurpose] Too few rationale cues across the file. Add brief "why" phrases where needed.
assert.message.lacks.purpose=[MMLacksPurpose] File has {0} rationale cues across {2} messages; expected at least {1}. Why: messages should explain why behaviour exists or constraints apply. Fix: add a rationale cue (because, due to, so that, in order to, to avoid, required by, workaround for, otherwise, if, despite). Ref: message-quality-guide.adoc#MMLacksPurpose
assert.message.low.entropy.intent=[MMLowEntropy] Message wording is repetitive across the file. Vary subjects, actions, and context words.
assert.message.low.entropy=[MMLowEntropy] File message entropy {0} below {1}. Why: word variety across messages is low. Fix: vary subject, action, and context words; add brief rationale comments where needed; avoid repeating phrasing. Ref: message-quality-guide.adoc#MMLowEntropy
assert.message.too.few.meaningful.intent=[MMTooFewMeaningfulWords] Message "{0}" lacks enough signal. Add subject, expected behaviour, and key data.
assert.message.too.few.meaningful=[MMTooFewMeaningfulWords] Message "{0}" has too few meaningful words. Why: unique meaningful words=[{1}] filler words=[{2}] count+placeholders={3} min={4}. Fix: {5}. Ref: message-quality-guide.adoc#MMTooFewMeaningfulWords
assert.message.too.long.intent=[MMTooLong] Message "{0}" is too long. Keep the invariant and move data to expected/actual.
assert.message.too.long=[MMTooLong] Message "{0}" too long. Why: words={1} max={2}. Fix: keep invariant, move data to expected/actual. Ref: message-quality-guide.adoc#MMTooLong
assert.message.whitespace.run.intent=[MMWhitespaceRun] Message "{0}" has repeated whitespace "{1}". Collapse to single spaces.
assert.message.whitespace.run=[MMWhitespaceRun] Message "{0}" contains repeated whitespace "{1}". Why: repeated whitespace often signals missing data or accidental formatting. Fix: collapse to single spaces or move data to expected/actual. Ref: message-quality-guide.adoc#MMWhitespaceRun
assert.message.long.word.intent=[MMLongWord] Message "{0}" has long token "{1}". Use shorter descriptive terms.
assert.message.long.word=[MMLongWord] Message "{0}" contains long token "{1}" (>{2} chars). Fix: use short descriptive domain terms. Ref: message-quality-guide.adoc#MMLongWord
assert.message.duplicates.input.intent=[MMDuplicatesInput] Message "{0}" echoes input "{1}". Describe the invariant instead of the data.
assert.message.duplicates.input=[MMDuplicatesInput] Message "{0}" duplicates input "{1}". Why: message just echoes the expected value or variable name. Fix: explain the invariant, not the data. Ref: message-quality-guide.adoc#MMDuplicatesInput
assert.message.assertall.heading.intent=[MMLowSignalAssertAllHeading] Low-signal assertAll heading "{0}". Name what the group validates.
assert.message.assertall.heading=[MMLowSignalAssertAllHeading] Low-signal assertAll heading "{0}". Why: heading should describe what the group validates. Fix: name the invariant being checked. Ref: message-quality-guide.adoc#MMLowSignalAssertAllHeading
assert.message.restates.derived.intent=[MMRestatesDerivedAssertion] Message "{0}" restates derived assertion "{1}". Explain why the property matters.
assert.message.restates.derived=[MMRestatesDerivedAssertion] Message "{0}" restates derived assertion "{1}". Why: derived assertions like isEmpty() already show condition in output. Fix: explain why this property matters. Ref: message-quality-guide.adoc#MMRestatesDerivedAssertion
assert.message.assertj.override.intent=[MMAssertJGenericOverride] Generic AssertJ override "{0}". Prefer as() or include specific diagnostics.
assert.message.assertj.override=[MMAssertJGenericOverride] Generic AssertJ override "{0}". Why: withFailMessage/overridingErrorMessage hides rich diff output. Fix: prefer as() for context, or include specific diagnostic info. Ref: message-quality-guide.adoc#MMAssertJGenericOverride
assert.message.missing.comparison.values.intent=[MMMissingComparisonValues] Comparison "{0}" should include operand values. Include {1} and {2} in the message.
assert.message.missing.comparison.values=[MMMissingComparisonValues] Comparison "{0}" uses operands {1} and {2} but message is constant. Why: when assertion fails, you won''t see the actual values. Fix: include operand values in message, e.g. {1} + " {0} " + {2} + " because...". Ref: message-quality-guide.adoc#MMMissingComparisonValues
assert.message.missing.string.value.intent=[MMMissingStringSearchValue] String search {0} on {1} should include the searched value. Include {2} in the message.
assert.message.missing.string.value=[MMMissingStringSearchValue] String search {0}() on {1} with {2} but message is constant. Why: when assertion fails, you won''t see the actual string. Fix: include the string value in message, e.g. {1} + " should contain " + {2}. Ref: message-quality-guide.adoc#MMMissingStringSearchValue
assert.message.missing.loop.index.intent=[MMMissingLoopIndex] Indexed loop assertion missing index. Include {0} in the message.
assert.message.missing.loop.index=[MMMissingLoopIndex] Assertion in indexed loop but message doesn''t include index "{0}". Why: when assertion fails, you won''t know which iteration failed. Fix: include the loop index in message, e.g. "at index " + {0}. Ref: message-quality-guide.adoc#MMMissingLoopIndex
assert.message.missing.subject.intent=[MMMissingSubject] Message "{0}" starts with a modal verb. Add a subject.
assert.message.missing.subject=[MMMissingSubject] Message "{0}" starts with modal verb without subject. Why: reader cannot tell what is being tested. Fix: add subject before modal verb, e.g. "method should return X" instead of "should return X". Ref: message-quality-guide.adoc#MMMissingSubject
assert.message.missing.message.intent=[MMMissingMessage] Missing message. {0}.
assert.message.missing.message=[MMMissingMessage] Missing message. Why: there is no message to guide triage. Fix: {0}. Ref: message-quality-guide.adoc#MMMissingMessage
assert.message.map.string.object.intent=[MMMapStringObject] {1} used for "{0}" without a reason comment. Prefer a DTO (or AbstractMarshallableCfg for config) or explain dynamic keys.
assert.message.map.string.object=[MMMapStringObject] {1} used for "{0}" without a reason comment. Why: Map hides schema when field names and types are known. Fix: use SelfDescribingMarshallable for known runtime fields, AbstractMarshallableCfg for config-backed data, or add a brief comment explaining the dynamic key set. Ref: message-quality-guide.adoc#MMMapStringObject
assert.message.throw.null.intent=[MMThrowNull] Throwing a null literal. Throw a real exception instead.
assert.message.throw.null=[MMThrowNull] Throw statement uses null literal. Fix: replace with "throw new UnsupportedOperationException()". Ref: message-quality-guide.adoc#MMThrowNull
assert.message.missing.display.name.intent=[MMDisplayName] JUnit 5 test "{0}" needs @DisplayName with a meaningful message for readable reports.
assert.message.missing.display.name=[MMDisplayName] JUnit 5 test "{0}" is missing @DisplayName annotation. Why: display names make test reports readable. Fix: add @DisplayName with a meaningful message to the test. Ref: message-quality-guide.adoc#MMDisplayName
assert.message.test.annotation.order.intent=[MMTestAnnotationOrder] Place @Test before other annotations. Found @Test after @{0} on "{1}".
assert.message.test.annotation.order=[MMTestAnnotationOrder] Place @Test before other annotations on test methods. Found @Test after @{0} on "{1}". Ref: message-quality-guide.adoc#MMTestAnnotationOrder
assert.message.junit4.annotation.intent=[MMJUnit4Annotation] JUnit 4 test annotation @{0} used. Migrate to JUnit 5 annotations.
assert.message.junit4.annotation=[MMJUnit4Annotation] JUnit 4 test annotation @{0} used. Fix: migrate to JUnit 5 test annotations and add @DisplayName with a meaningful message. Ref: message-quality-guide.adoc#MMJUnit4Annotation
assert.message.junit4.assertion.intent=[MMJUnit4Assertion] JUnit 4 assertion used. Migrate to org.junit.jupiter.api.Assertions.
assert.message.junit4.assertion=[MMJUnit4Assertion] JUnit 4 assertion used. Fix: migrate to org.junit.jupiter.api.Assertions and add @DisplayName on tests with a meaningful message. Ref: message-quality-guide.adoc#MMJUnit4Assertion
assert.message.extraction.failure.intent=[MMExtractionFile] Message extraction output unavailable: {0}. Check messageExtractionFile or disable extraction.
assert.message.extraction.failure=[MMExtractionFile] Message extraction output disabled: {0}. Fix: set messageExtractionFile to a writable file path or disable extraction. Ref: message-quality-guide.adoc#MMExtractionFile
assert.message.unexpected.exception.intent=[MMUnexpected] MeaningfulMessageCheck error: {0}. Update the quality check to handle this case.
assert.message.unexpected.exception=[MMUnexpected] MeaningfulMessageCheck error: {0}. Why: unhandled AST shape. Fix: update the quality check to handle this case. Ref: message-quality-guide.adoc#MMUnexpected
assert.message.unhandled.intent=[MMUnhandled] Unhandled message extraction: {0}. Extend the rules or suppress if expected. Context: {1}.
assert.message.unhandled=[MMUnhandled] Unhandled message extraction: {0}. Context: {1}. Fix: extend the quality rules to cover this case, or suppress with emitUnhandled=false or @SuppressWarnings("MMUnhandled"). Ref: message-quality-guide.adoc#MMUnhandled
