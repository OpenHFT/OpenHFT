# Meaningful Message Check - Message Templates
# Format: [CODE] Problem. Why: Evidence. Fix: Action. Ref: anchor

assert.message.duplicate=[MMDuplicate] Duplicate message "{0}". Why: first used at line {1}. Fix: describe the specific invariant at this site. Ref: assertion-messages.adoc#MMDuplicate

assert.message.redundant.class=[MMRedundantClassName] Message "{0}" depends on class name "{1}". Why: {2}. Fix: add 2+ meaningful words that survive without the name. Ref: assertion-messages.adoc#MMRedundantClassName

assert.message.redundant.method=[MMRedundantMethodName] Message "{0}" depends on method name "{1}". Why: {2}. Fix: add 2+ meaningful words that survive without the name. Ref: assertion-messages.adoc#MMRedundantMethodName

assert.message.redundant.line=[MMRedundantLineNumber] Message "{0}" contains line token "{1}". Why: stack traces show line numbers. Fix: remove and describe the invariant. Ref: assertion-messages.adoc#MMRedundantLineNumber

assert.message.trivial.supplier=[MMTrivialSupplier] Trivial Supplier "{0}". Why: simple or cheap supplier adds overhead with no benefit. Fix: use plain String or move construction into a helper. Ref: assertion-messages.adoc#MMTrivialSupplier

assert.message.generic=[MMGenericMessage] Generic message "{0}". Why: no subject or expected behaviour. Fix: name what is checked and what should hold. Ref: assertion-messages.adoc#MMGenericMessage

assert.message.restates.assertion=[MMRestatesAssertion] Message "{0}" restates the assertion. Fix: explain expected behaviour, not assertion type. Ref: assertion-messages.adoc#MMRestatesAssertion

assert.message.index.only=[MMIndexOnly] Index-only message "{0}". Fix: include what the element represents. Ref: assertion-messages.adoc#MMIndexOnly

assert.message.contextless=[MMContextless] Contextless message "{0}". Fix: state what is compared and why it matters. Ref: assertion-messages.adoc#MMContextless

assert.message.too.short=[MMTooShort] Message "{0}" too short. Why: words/placeholders={1} min={2}. Fix: add subject + expected behaviour. Ref: assertion-messages.adoc#MMTooShort

assert.message.too.few.meaningful=[MMTooFewMeaningfulWords] Message "{0}" has too few meaningful words. Why: meaningful words/placeholders={1} min={2}. Fix: add meaningful words or placeholders to meet the minimum. Ref: assertion-messages.adoc#MMTooFewMeaningfulWords

assert.message.too.long=[MMTooLong] Message "{0}" too long. Why: words={1} max={2}. Fix: keep invariant, move data to expected/actual. Ref: assertion-messages.adoc#MMTooLong

assert.message.whitespace.run=[MMWhitespaceRun] Message "{0}" contains repeated whitespace "{1}". Why: repeated whitespace often signals missing data or accidental formatting. Fix: collapse to single spaces or move data to expected/actual. Ref: assertion-messages.adoc#MMWhitespaceRun

assert.message.long.word=[MMLongWord] Message "{0}" contains long token "{1}" (>{2} chars). Fix: use short descriptive domain terms. Ref: assertion-messages.adoc#MMLongWord

assert.message.duplicates.input=[MMDuplicatesInput] Message "{0}" duplicates input "{1}". Why: message just echoes the expected value or variable name. Fix: explain the invariant, not the data. Ref: assertion-messages.adoc#MMDuplicatesInput

assert.message.assertall.heading=[MMLowSignalAssertAllHeading] Low-signal assertAll heading "{0}". Why: heading should describe what the group validates. Fix: name the invariant being checked. Ref: assertion-messages.adoc#MMLowSignalAssertAllHeading

assert.message.restates.derived=[MMRestatesDerivedAssertion] Message "{0}" restates derived assertion "{1}". Why: derived assertions like isEmpty() already show condition in output. Fix: explain why this property matters. Ref: assertion-messages.adoc#MMRestatesDerivedAssertion

assert.message.assertj.override=[MMAssertJGenericOverride] Generic AssertJ override "{0}". Why: withFailMessage/overridingErrorMessage hides rich diff output. Fix: prefer as() for context, or include specific diagnostic info. Ref: assertion-messages.adoc#MMAssertJGenericOverride

assert.message.missing.comparison.values=[MMMissingComparisonValues] Comparison "{0}" uses operands {1} and {2} but message is constant. Why: when assertion fails, you won''t see the actual values. Fix: include operand values in message, e.g. {1} + " {0} " + {2} + " because...". Ref: assertion-messages.adoc#MMMissingComparisonValues

assert.message.missing.string.value=[MMMissingStringSearchValue] String search {0}() on {1} with {2} but message is constant. Why: when assertion fails, you won''t see the actual string. Fix: include the string value in message, e.g. {1} + " should contain " + {2}. Ref: assertion-messages.adoc#MMMissingStringSearchValue

assert.message.missing.loop.index=[MMMissingLoopIndex] Assertion in indexed loop but message doesn''t include index "{0}". Why: when assertion fails, you won''t know which iteration failed. Fix: include the loop index in message, e.g. "at index " + {0}. Ref: assertion-messages.adoc#MMMissingLoopIndex

assert.message.missing.subject=[MMMissingSubject] Message "{0}" starts with modal verb without subject. Why: reader cannot tell what is being tested. Fix: add subject before modal verb, e.g. "method should return X" instead of "should return X". Ref: assertion-messages.adoc#MMMissingSubject

assert.message.missing.message=[MMMissingMessage] Missing message. Why: there is no message to guide triage. Fix: add a meaningful message, supply a Throwable, or add a /* reason */ comment inside the argument list when a message must be omitted. Ref: assertion-messages.adoc#MMMissingMessage
